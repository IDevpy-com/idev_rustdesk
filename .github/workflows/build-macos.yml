# Soporte iDev: macOS builds (Intel x86_64 and Apple Silicon arm64) of the customized
# RustDesk OSS client.
#
# Reproduces the official "build-for-macOS" job of flutter-build.yml (RustDesk 1.5.0)
# and adds the Soporte iDev steps: hbb_common patch, "Soporte iDev.app" bundle with
# license files, ad-hoc signature, bundle/DMG checks, launch test and SHA-256 sums.
#
# Without Apple Developer credentials the app is ad-hoc signed (not notarized).
# Developer ID signing and notarization run only when these repository secrets exist
# (prepared, not tested yet):
#   MACOS_P12_BASE64, MACOS_P12_PASSWORD   Developer ID Application certificate (.p12)
#   MACOS_CODESIGN_IDENTITY                e.g. "Developer ID Application: iDev (TEAMID)"
#   MACOS_NOTARY_APPLE_ID, MACOS_NOTARY_TEAM_ID, MACOS_NOTARY_PASSWORD (app-specific password)
name: Soporte iDev - macOS

on:
  workflow_dispatch:
    inputs:
      launch-test:
        description: "Launch the app on the runner (connects to rustdesk.idevpy.com for ~40 s)"
        type: boolean
        default: true

env:
  # Same versions as .github/workflows/flutter-build.yml at tag 1.5.0 (build-for-macOS).
  MAC_RUST_VERSION: "1.81" # required by cidre (screencapturekit)
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.0"
  APP_BUNDLE: "Soporte iDev.app"
  BUILT_APP: "flutter/build/macos/Build/Products/Release/Soporte-iDev.app"
  MACOS_P12_BASE64: "${{ secrets.MACOS_P12_BASE64 }}"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-macos:
    name: ${{ matrix.job.target }}
    needs: [generate-bridge]
    runs-on: ${{ matrix.job.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: x86_64-apple-darwin,
              os: macos-15-intel,
              arch: x86_64,
              label: Intel,
              extra-build-args: "",
              # Deployment target of the Flutter Xcode project and build.py.
              min-macos: "10.14",
            }
          - {
              target: aarch64-apple-darwin,
              os: macos-14,
              arch: arm64,
              label: AppleSilicon,
              # ScreenCaptureKit needs macOS 12.3, so the official build raises the
              # deployment target for arm64 (all Apple Silicon Macs run macOS >= 11).
              extra-build-args: "--screencapturekit",
              min-macos: "12.3",
            }
    env:
      DMG: Soporte-iDev-macOS-${{ matrix.job.label }}.dmg
    defaults:
      run:
        # bash -eo pipefail: a failing check piped to tee must fail the step.
        shell: bash
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Apply Soporte iDev changes to hbb_common
        run: |
          python3 idev/tools/apply_hbb_common.py
          git -C libs/hbb_common diff

      - name: Show runner information
        run: |
          echo "commit: $(git rev-parse HEAD)"
          echo "hbb_common: $(git -C libs/hbb_common rev-parse HEAD)"
          sw_vers
          uname -m
          xcodebuild -version
          xcode-select -p

      - name: Install build runtime
        run: |
          brew install llvm create-dmg
          # pkg-config is handled in a separate step, because it may be already installed by the runner
          if command -v pkg-config &>/dev/null; then
              echo "pkg-config is already installed"
          else
              brew install pkg-config
          fi

      - name: Install NASM
        run: |
          # Same as the official build: NASM 2.16.x from nasm.us (NASM 3.x from brew breaks aom).
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Workaround for flutter issue
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          # https://github.com/flutter/flutter/issues/133533
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart
          grep -n '_setFramesEnabledState(false);' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: soporte-idev-${{ matrix.job.os }}

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          ls "$VCPKG_ROOT/installed"

      - name: Show version information (Rust, cargo, Clang, Flutter)
        run: |
          clang --version || true
          rustup -V
          rustup toolchain list
          rustup default
          cargo -V
          rustc -V
          flutter --version

      - name: Build Soporte iDev
        run: |
          if [ "${{ matrix.job.arch }}" = "arm64" ]; then
            MIN_MACOS_VERSION="${{ matrix.job.min-macos }}"
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
            sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
            sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          fi
          python3 ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }}
          ls -la "$BUILT_APP/Contents/MacOS" "$BUILT_APP/Contents/Frameworks"

      - name: Assemble "Soporte iDev.app"
        run: |
          mkdir -p out
          # The executable keeps the internal name (Soporte-iDev); only the bundle folder
          # gets the visible name. Renaming the folder does not affect the signature.
          ditto "$BUILT_APP" "out/$APP_BUNDLE"
          res="out/$APP_BUNDLE/Contents/Resources/LICENSES"
          mkdir -p "$res"
          cp LICENCE "$res/RustDesk-AGPL-3.0.txt"
          cp idev/LICENSES/NOTICE.txt "$res/NOTICE.txt"

      - name: Import the codesign certificate (optional)
        if: env.MACOS_P12_BASE64 != ''
        uses: apple-actions/import-codesign-certs@253ddeeac23f2bdad1646faac5c8c2832e800071 # v1
        with:
          p12-file-base64: ${{ secrets.MACOS_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_P12_PASSWORD }}
          keychain: soporte-idev

      - name: Sign the app
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          identity="-"
          if [ -n "$MACOS_P12_BASE64" ]; then
            identity="$MACOS_CODESIGN_IDENTITY"
            security find-identity -v
          fi
          echo "signing identity: $([ "$identity" = "-" ] && echo "ad-hoc (-)" || echo "Developer ID")"
          # Signs nested frameworks, the service helper and the app with Release.entitlements
          # (hardened runtime). Needed also for ad-hoc: build.py copies the service helper
          # after Xcode signed the bundle, which breaks the original seal.
          bash ./.github/scripts/sign-macos-app.sh "out/$APP_BUNDLE" "$identity" ./flutter/macos/Runner/Release.entitlements

      - name: Verify "Soporte iDev.app"
        run: |
          mkdir -p logs
          bash idev/tools/verify_macos_app.sh "out/$APP_BUNDLE" ${{ matrix.job.arch }} ${{ matrix.job.min-macos }} 2>&1 | tee "logs/verify-app-${{ matrix.job.label }}.txt"

      - name: Create DMG
        run: |
          # Same as the official build: give create-dmg more attempts to unmount the image.
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          mkdir -p dmg-src dist
          ditto "out/$APP_BUNDLE" "dmg-src/$APP_BUNDLE"
          create-dmg \
            --volname "Soporte iDev" \
            --volicon flutter/macos/Runner/AppIcon.icns \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "$APP_BUNDLE" 200 190 \
            --hide-extension "$APP_BUNDLE" \
            --app-drop-link 600 185 \
            --add-file "LEAME.txt" idev/README-macOS.txt 400 330 \
            "dist/$DMG" dmg-src/

      - name: Sign and notarize the DMG (optional)
        if: env.MACOS_P12_BASE64 != ''
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          codesign --force --timestamp -s "$MACOS_CODESIGN_IDENTITY" "dist/$DMG" -vvv
          if [ -n "$MACOS_NOTARY_APPLE_ID" ]; then
            xcrun notarytool submit "dist/$DMG" --apple-id "$MACOS_NOTARY_APPLE_ID" \
              --team-id "$MACOS_NOTARY_TEAM_ID" --password "$MACOS_NOTARY_PASSWORD" --wait
            xcrun stapler staple "dist/$DMG"
          else
            echo "MACOS_NOTARY_* secrets not set: DMG signed but not notarized"
          fi

      - name: Verify DMG contents
        run: |
          hdiutil verify "dist/$DMG"
          hdiutil imageinfo "dist/$DMG" | grep -E '^(Format|Format Description|Checksum Type):' || true
          mnt=$(mktemp -d /tmp/soporte-idev-dmg.XXXX)
          hdiutil attach -readonly -nobrowse -mountpoint "$mnt" "dist/$DMG"
          ls -la "$mnt"
          status=0
          [ -L "$mnt/Applications" ] && [ "$(readlink "$mnt/Applications")" = "/Applications" ] || { echo "FAIL Applications link"; status=1; }
          [ -s "$mnt/LEAME.txt" ] || { echo "FAIL LEAME.txt"; status=1; }
          bash idev/tools/verify_macos_app.sh "$mnt/$APP_BUNDLE" ${{ matrix.job.arch }} ${{ matrix.job.min-macos }} \
            > "logs/verify-dmg-${{ matrix.job.label }}.txt" 2>&1 || status=1
          cat "logs/verify-dmg-${{ matrix.job.label }}.txt"
          # Keep a copy of the app exactly as shipped for the launch test.
          rm -rf /tmp/launch && mkdir -p /tmp/launch
          ditto "$mnt/$APP_BUNDLE" "/tmp/launch/$APP_BUNDLE"
          hdiutil detach "$mnt"
          exit $status

      - name: Launch test
        if: inputs.launch-test
        run: |
          # Run every check and quit the app even if one fails; the result is decided at the end.
          set +e +o pipefail
          app="/tmp/launch/$APP_BUNDLE"
          log="logs/launch-${{ matrix.job.label }}.txt"
          status=0
          {
            echo "== Launch: $app"
            open -n "$app"
            sleep 40
            if pgrep -fl "Soporte-iDev" ; then echo "OK      process running after 40 s"; else echo "FAIL    process not running"; status=1; fi
            screencapture -x "logs/screenshot-${{ matrix.job.label }}.png" || echo "screencapture failed"
            echo "== Rust log (~/Library/Logs/Soporte-iDev)"
            ls -la ~/Library/Logs/Soporte-iDev 2>/dev/null || true
            find ~/Library/Logs/Soporte-iDev -type f -name '*.log' -exec cat {} + 2>/dev/null > /tmp/rust.log || true
            grep -E "rendezvous|start (tcp|udp)|register|key_confirmed|error|panic" /tmp/rust.log | grep -v "key_pair" | head -60
            if grep -q "start rendezvous mediator of rustdesk.idevpy.com" /tmp/rust.log; then
              echo "OK      rendezvous mediator uses rustdesk.idevpy.com"
            else
              echo "FAIL    no rendezvous mediator for rustdesk.idevpy.com in the log"; status=1
            fi
            if grep -E "rs-ny|rs-sg|rs-cn|rustdesk\.com" /tmp/rust.log; then
              echo "FAIL    public RustDesk host in the log"; status=1
            else
              echo "OK      no public RustDesk host in the log"
            fi
            echo "== Config (~/Library/Preferences/com.carriez.Soporte-iDev), secrets not printed"
            prefs=~/Library/Preferences/com.carriez.Soporte-iDev
            ls -la "$prefs" 2>/dev/null || true
            if [ -f "$prefs/Soporte-iDev.toml" ]; then
              grep -E "^id = " "$prefs/Soporte-iDev.toml" || true
              if grep -qE "^password = '.+'" "$prefs/Soporte-iDev.toml"; then
                echo "FAIL    a permanent password is set"; status=1
              else
                echo "OK      no permanent password"
              fi
            fi
            [ -f "$prefs/Soporte-iDev2.toml" ] && sed -n '/^\[options\]/,$p' "$prefs/Soporte-iDev2.toml"
            echo "== Persistent services and login items"
            if ls /Library/LaunchAgents /Library/LaunchDaemons ~/Library/LaunchAgents 2>/dev/null | grep -i -E "soporte|idev|rustdesk"; then
              echo "FAIL    launchd plist installed"; status=1
            else
              echo "OK      no LaunchAgent/LaunchDaemon installed"
            fi
            echo "== Quit"
            osascript -e 'quit app "Soporte iDev"' || true
            sleep 5
            pkill -f "Soporte-iDev" || true
          } 2>&1 | tee "$log"
          cp /tmp/rust.log "logs/rust-log-${{ matrix.job.label }}.txt" 2>/dev/null || true
          grep -q "^FAIL" "$log" && exit 1 || exit 0

      - name: SHA-256
        run: |
          cd dist
          shasum -a 256 "$DMG" | tee "$DMG.sha256"

      - name: Upload DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Soporte-iDev-macOS-${{ matrix.job.label }}
          path: dist/
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-macOS-${{ matrix.job.label }}
          path: logs/
          retention-days: 30
          if-no-files-found: ignore

  checksums:
    name: SHA256SUMS.txt
    needs: [build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download DMGs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Soporte-iDev-macOS-*
          merge-multiple: true
          path: dist

      - name: Create SHA256SUMS.txt
        run: |
          cd dist
          rm -f *.sha256
          sha256sum *.dmg | tee SHA256SUMS.txt
          ls -la

      - name: Upload macOS packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Soporte-iDev-macOS
          path: dist/
          retention-days: 30
